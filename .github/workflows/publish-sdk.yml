name: Publish SDK to npm

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag sdk-v$TAG does not match sdk/package.json version $PKG"
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm pack --dry-run > /tmp/pack.txt 2>&1
          COUNT="$(grep -c 'dist/' /tmp/pack.txt || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::Tarball contains no dist/ files"
            cat /tmp/pack.txt
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
